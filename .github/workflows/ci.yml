name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Runner tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: CLI help smoke
        run: |
          scripts/walter --help
          scripts/walter run-safe --goal 'CI dry-run smoke' --project-path workspace-repo --allowed-path 'src/**' --verification-command 'python3 -m unittest discover -s tests -v' --dry-run --print-command
      - name: Workspace helper tests
        run: python -m unittest discover -s workspace-repo/tests -v
