name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Runner tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: CLI help smoke
        run: |
          scripts/walter --help
          scripts/walter run-safe --goal 'CI dry-run smoke' --project-path workspace-repo --allowed-path 'src/**' --verification-command 'python3 -m unittest discover -s tests -v' --dry-run --print-command
      - name: Workspace helper tests
        run: python -m unittest discover -s workspace-repo/tests -v
