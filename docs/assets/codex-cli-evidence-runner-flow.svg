<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Codex CLI Evidence Runner flow</title>
  <desc id="desc">A workflow diagram showing task contract, scoped Codex CLI run, evidence bundle, safety gate, score, and human review before applying a patch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 800 44px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #cbd5e1; }
      .box-title { font: 800 21px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
      .box-text { font: 500 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #cbd5e1; }
      .small { font: 600 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #93c5fd; }
      .badge { font: 800 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .line { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="720" rx="0" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="220" fill="#1e3a8a" opacity="0.18"/>
  <circle cx="160" cy="650" r="260" fill="#065f46" opacity="0.16"/>

  <text x="72" y="82" class="title">Codex CLI Evidence Runner</text>
  <text x="72" y="118" class="subtitle">Codex can say “done”. This runner asks for proof before you trust the patch.</text>

  <rect x="72" y="158" width="250" height="116" rx="22" fill="#1e293b" stroke="#334155" filter="url(#shadow)"/>
  <text x="98" y="198" class="box-title">1. Task contract</text>
  <text x="98" y="230" class="box-text">goal, allowed paths,</text>
  <text x="98" y="253" class="box-text">forbidden paths, checks</text>

  <path class="line" d="M322 216 H394"/>

  <rect x="410" y="158" width="250" height="116" rx="22" fill="#1e293b" stroke="#334155" filter="url(#shadow)"/>
  <text x="436" y="198" class="box-title">2. Scoped Codex run</text>
  <text x="436" y="230" class="box-text">detached git worktree,</text>
  <text x="436" y="253" class="box-text">no auto-commit</text>

  <path class="line" d="M660 216 H732"/>

  <rect x="748" y="158" width="250" height="116" rx="22" fill="#1e293b" stroke="#334155" filter="url(#shadow)"/>
  <text x="774" y="198" class="box-title">3. Evidence bundle</text>
  <text x="774" y="230" class="box-text">logs, diff, tests,</text>
  <text x="774" y="253" class="box-text">receipt, report</text>

  <path class="line" d="M998 216 H1070"/>

  <rect x="1086" y="158" width="202" height="116" rx="22" fill="#172554" stroke="#38bdf8" filter="url(#shadow)" transform="translate(-28 0)"/>
  <text x="1082" y="198" class="box-title">4. Safety gate</text>
  <text x="1082" y="230" class="box-text">rejects unsafe</text>
  <text x="1082" y="253" class="box-text">or unproven runs</text>

  <rect x="138" y="350" width="300" height="164" rx="24" fill="#0f172a" stroke="#334155" filter="url(#shadow)"/>
  <text x="168" y="392" class="box-title">Evidence files</text>
  <text x="168" y="425" class="box-text">input.json · policy.yaml</text>
  <text x="168" y="449" class="box-text">prompt.md · codex.log</text>
  <text x="168" y="473" class="box-text">diff.patch · verify.log</text>
  <text x="168" y="497" class="box-text">receipt.json · report.md</text>

  <rect x="490" y="350" width="300" height="164" rx="24" fill="#0f172a" stroke="#334155" filter="url(#shadow)"/>
  <text x="520" y="392" class="box-title">Checks</text>
  <text x="520" y="425" class="box-text">changed-file boundary</text>
  <text x="520" y="449" class="box-text">verification exit codes</text>
  <text x="520" y="473" class="box-text">heuristic secret scan</text>
  <text x="520" y="497" class="box-text">log-based outside-read scan</text>

  <rect x="842" y="350" width="300" height="164" rx="24" fill="#0f172a" stroke="#334155" filter="url(#shadow)"/>
  <text x="872" y="392" class="box-title">Decision</text>
  <text x="872" y="425" class="box-text">score the evidence</text>
  <text x="872" y="449" class="box-text">dry-run apply first</text>
  <text x="872" y="473" class="box-text">human or foreman review</text>
  <text x="872" y="497" class="box-text">then accept or reject</text>

  <path d="M288 350 C288 316 872 316 872 282" class="line" opacity="0.65"/>
  <path d="M640 350 C640 316 872 316 872 282" class="line" opacity="0.65"/>
  <path d="M992 350 C992 316 1080 316 1080 282" class="line" opacity="0.65"/>

  <rect x="72" y="588" width="1100" height="58" rx="18" fill="url(#accent)" opacity="0.95"/>
  <text x="104" y="624" class="badge">Not another coding agent. A proof layer for Codex CLI runs: diff, logs, tests, receipt, gate.</text>
</svg>
